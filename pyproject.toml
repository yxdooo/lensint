[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lensint"
version = "3.5.0"
description = "Enterprise Digital Media Forensics, Steganography Extraction & Threat Intelligence Framework"
readme = "README.md"
authors = [
    { name = "Lensint Security Team", email = "research@lensint.io" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "forensics",
    "image-forensics",
    "video-forensics",
    "steganography",
    "malware-analysis",
    "ai-detection",
    "deepfake-detection",
    "c2pa",
    "rppg",
    "osint",
    "stix2",
    "dfir"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "reportlab>=3.6.0",
    "requests>=2.28.0",
    "PyExifTool>=0.5.6",
    "numba>=0.58.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
]
cv = [
    "opencv-python-headless>=4.8.0",
    "scipy>=1.10.0",
]
crypto = [
    "cbor2>=5.4.0",
    "cryptography>=41.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "bandit>=1.7.5",
    "httpx>=0.24.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "opencv-python-headless>=4.8.0",
    "scipy>=1.10.0",
    "cbor2>=5.4.0",
    "cryptography>=41.0.0",
    "reportlab>=3.6.0",
    "requests>=2.28.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
lensint = "lensint.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lensint*"]
exclude = ["sample_images*", "docs*", "tests*"]

[tool.setuptools.package-data]
lensint = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

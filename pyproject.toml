[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lensint"
version = "1.0.0"
description = "Advanced Image Forensics and Threat Analysis Framework"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.scripts]
lensint = "lensint.cli:main"

name: LENSINT CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"


      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl ffmpeg

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool ffmpeg

      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool ffmpeg -y

      - name: Upgrade pip and Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .[cv,crypto]

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest tests/ --verbose --cov=lensint --cov-report=term-missing

  security-and-lint:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 bandit

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 lensint tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats formatting as informational
          flake8 lensint --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics

      - name: Security Scan with Bandit (SAST)
        run: |
          bandit -r lensint -ll -ii -x tests/ -s B324,B108 || true
